name: Report a problem
description: Something in Talqava does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time. Plain words are perfect; you do not need to know the code.
        **Security problems:** please do not report them here. Use the private form on the Security tab instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, step by step, and what you saw.
      placeholder: "1. Opened Organization\n2. Dragged the Marketing team onto the Head of Sales\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: How do you run Talqava?
      options:
        - The Mac app
        - In my browser (installed with the one-line install)
        - From the source code
        - On a server with Docker
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Which AI model?
      placeholder: "e.g. Claude Opus 5.5, an OpenRouter model, Ollama with qwen3:8b"
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: Drag screenshots in here. Please hide any keys, passwords or private information first.
