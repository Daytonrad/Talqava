name: Verify Organization Add list
on:
  push:
    branches: [verify/talqava-16-linux]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e4556be28ae58880316f6b3fbcf39125398cfc54
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run check
