name: Add list theme screenshots
on:
  push:
    branches: [evidence/talqava-16-themes]
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e4556be28ae58880316f6b3fbcf39125398cfc54
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Capture the Organization Add list in both themes
        shell: bash
        run: |
          set -eu
          work="$RUNNER_TEMP/talqava-browser"
          npm install --prefix "$work" --no-audit --no-fund --ignore-scripts playwright-core@1.56.1
          mkdir -p screenshots
          export TALQAVA_DATA_DIR="$RUNNER_TEMP/talqava-data" PORT=18776 HOST=127.0.0.1
          node src/local/main.ts > "$RUNNER_TEMP/talqava.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for i in {1..90}; do curl -fsS http://127.0.0.1:18776/ >/dev/null && break; sleep 1; done
          export CHROME_BIN="$(command -v google-chrome)" NODE_PATH="$work/node_modules"
          node <<'JS'
          const { chromium } = require('playwright-core');
          const assert = require('node:assert/strict');
          (async () => {
            const browser = await chromium.launch({ executablePath: process.env.CHROME_BIN });
            try {
              const page = await browser.newPage({ viewport: { width: 1440, height: 950 } });
              await page.goto('http://127.0.0.1:18776/');
              const org = page.getByRole('button', { name: 'Organization', exact: true }).first();
              const search = page.getByRole('searchbox', { name: 'Find a role or a team' });
              await org.click();
              try { await search.waitFor({ timeout: 8000 }); } catch { await org.click(); await search.waitFor(); }
              await page.locator('.additem.team').first().waitFor();
              await search.fill('Business');
              await search.blur();
              const name = page.locator('.additem .posmain b').filter({ hasText: 'Business Development Specialist' }).first();
              await name.waitFor();
              await page.evaluate(() => document.fonts.ready);
              for (const theme of ['light', 'dark']) {
                await page.evaluate(t => window.talqavaTheme.set(t), theme);
                const fits = await name.evaluate(el => el.scrollWidth <= el.clientWidth && el.clientHeight > parseFloat(getComputedStyle(el).lineHeight));
                assert.ok(fits, theme + ': role name wraps and fits');
                await page.locator('.addbar').screenshot({ path: 'screenshots/add-list-' + theme + '.png' });
              }
            } finally { await browser.close(); }
          })().catch(err => { console.error(err); process.exitCode = 1; });
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: add-list-light-and-dark
          path: screenshots/*.png
          if-no-files-found: error
